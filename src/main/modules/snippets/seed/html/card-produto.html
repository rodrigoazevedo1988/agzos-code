<article class="group w-full max-w-sm border border-[{{cor_texto}}]/15 bg-[{{cor_fundo}}] text-[{{cor_texto}}] transition hover:border-[{{cor_texto}}]/40" style="font-family: {{fonte}}">
  <div class="relative aspect-[4/5] overflow-hidden bg-[{{cor_secundaria}}]">
    <svg class="absolute inset-0 h-full w-full" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração do produto: tênis de corrida">
      <rect width="400" height="500" fill="currentColor" opacity="0.03" />
      <circle cx="200" cy="250" r="150" fill="{{cor_primaria}}" opacity="0.18" />
      <path d="M70 320c40-10 70-60 110-60 30 0 40 30 80 30 40 0 70 20 80 50 4 12-4 20-16 20H86c-20 0-30-34-16-40z" fill="{{cor_primaria}}" />
      <path d="M70 360h270" stroke="currentColor" stroke-width="10" stroke-linecap="round" opacity="0.6" />
    </svg>
    <span class="absolute left-4 top-4 bg-[{{cor_primaria}}] px-2 py-1 text-xs font-semibold uppercase tracking-wider text-white">-20%</span>
  </div>
  <div class="p-5 sm:p-6">
    <p class="font-mono text-xs uppercase tracking-[0.2em] text-[{{cor_texto}}]/60">Corrida</p>
    <h3 class="mt-2 text-lg font-semibold"><a href="{{url_site}}/produtos/tenis-pulse" class="focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[{{cor_primaria}}]">Tênis Pulse 2</a></h3>
    <p class="mt-1 text-sm text-[{{cor_texto}}]/70">Amortecimento leve para treinos de até 21 km.</p>
    <div class="mt-5 flex items-end justify-between gap-4">
      <p>
        <span class="sr-only">Preço atual:</span>
        <span class="text-2xl font-semibold">R$ 479,90</span>
        <span class="ml-2 text-sm text-[{{cor_texto}}]/60 line-through"><span class="sr-only">Preço anterior:</span>R$ 599,90</span>
      </p>
      <button type="button" class="inline-flex items-center gap-2 bg-[{{cor_primaria}}] px-4 py-2.5 text-sm font-semibold text-white transition hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[{{cor_primaria}}]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 4h2l2.4 11h11.2L21 8H7" /><circle cx="9" cy="20" r="1.5" /><circle cx="18" cy="20" r="1.5" /></svg>
        Comprar
      </button>
    </div>
  </div>
</article>
