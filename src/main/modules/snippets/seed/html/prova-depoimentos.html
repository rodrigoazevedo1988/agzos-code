<section class="bg-[{{cor_fundo}}] px-6 py-20 text-[{{cor_texto}}] md:py-28" style="font-family: {{fonte}}">
  <div class="mx-auto max-w-6xl">
    <figure class="border-l-4 border-[{{cor_primaria}}] pl-6 md:pl-10">
      <blockquote class="max-w-4xl text-2xl font-medium leading-snug tracking-tight md:text-4xl">
        “Em três meses a loja passou a vender mais pelo site do que pelo WhatsApp. E a gente finalmente sabe de onde vem cada pedido.”
      </blockquote>
      <figcaption class="mt-8 flex items-center gap-4">
        <span class="grid h-12 w-12 place-items-center rounded-full bg-[{{cor_secundaria}}] text-sm font-semibold" aria-hidden="true">MR</span>
        <span><span class="block font-semibold">Marina Rocha</span><span class="block text-sm text-[{{cor_texto}}]/70">Diretora comercial, Casa Aurora</span></span>
      </figcaption>
    </figure>
    <div class="mt-16 grid gap-px bg-[{{cor_texto}}]/15 md:grid-cols-2">
      <figure class="bg-[{{cor_fundo}}] p-8">
        <blockquote class="leading-relaxed text-[{{cor_texto}}]/85">“Prazo cumprido, código entregue limpo e um time que responde no mesmo dia. Raro.”</blockquote>
        <figcaption class="mt-6 text-sm"><span class="font-semibold">Diego Martins</span> <span class="text-[{{cor_texto}}]/70">· CTO, Fretly</span></figcaption>
      </figure>
      <figure class="bg-[{{cor_fundo}}] p-8">
        <blockquote class="leading-relaxed text-[{{cor_texto}}]/85">“O custo por lead caiu 41% sem aumentar a verba. Os testes semanais fizeram a diferença.”</blockquote>
        <figcaption class="mt-6 text-sm"><span class="font-semibold">Patrícia Lemos</span> <span class="text-[{{cor_texto}}]/70">· Marketing, Clínica Vértice</span></figcaption>
      </figure>
    </div>
  </div>
</section>
