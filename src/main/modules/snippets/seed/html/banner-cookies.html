<div role="region" aria-label="Aviso de cookies" class="mx-auto w-full max-w-3xl border border-[{{cor_texto}}]/15 border-l-4 border-l-[{{cor_primaria}}] bg-[{{cor_secundaria}}] p-6 text-[{{cor_texto}}] shadow-2xl shadow-black/40 sm:p-7" style="font-family: {{fonte}}">
  <div class="flex flex-col gap-6 md:flex-row md:items-center">
    <div class="flex-1">
      <h2 class="text-base font-semibold">Cookies, só os necessários</h2>
      <p class="mt-2 text-sm leading-relaxed text-[{{cor_texto}}]/75">
        Usamos cookies para o site funcionar e, com sua permissão, para medir audiência. Você pode mudar isso quando quiser na
        <a href="{{url_site}}/privacidade" class="text-[{{cor_texto}}] underline decoration-[{{cor_primaria}}] underline-offset-4 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[{{cor_primaria}}]">política de privacidade</a>.
      </p>
    </div>
    <div class="flex shrink-0 flex-col gap-3 sm:flex-row">
      <button type="button" class="border border-[{{cor_texto}}]/25 px-5 py-2.5 text-sm font-semibold transition hover:border-[{{cor_texto}}] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[{{cor_primaria}}]">Só necessários</button>
      <button type="button" class="bg-[{{cor_primaria}}] px-5 py-2.5 text-sm font-semibold text-white transition hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[{{cor_primaria}}]">Aceitar todos</button>
    </div>
  </div>
</div>
