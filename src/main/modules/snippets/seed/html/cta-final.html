<section class="bg-[{{cor_fundo}}] text-[{{cor_texto}}]" style="font-family: {{fonte}}">
  <div class="mx-auto max-w-6xl border-t border-[{{cor_texto}}]/15 px-6 py-24 md:py-32">
    <p class="font-mono text-xs uppercase tracking-[0.25em] text-[{{cor_texto}}]/70">Próximo passo</p>
    <a href="{{url_site}}/contato" class="group mt-6 block focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-8 focus-visible:outline-[{{cor_primaria}}]">
      <span class="block text-5xl font-semibold leading-none tracking-tight sm:text-6xl md:text-8xl">Vamos</span>
      <span class="flex items-center gap-4 text-5xl font-semibold leading-none tracking-tight text-[{{cor_primaria}}] sm:text-6xl md:gap-8 md:text-8xl">
        conversar
        <svg class="h-10 w-10 transition-transform group-hover:translate-x-2 md:h-20 md:w-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </span>
    </a>
    <div class="mt-14 flex flex-col gap-2 text-[{{cor_texto}}]/75 md:flex-row md:gap-10">
      <a href="mailto:{{email_contato}}" class="hover:text-[{{cor_texto}}] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[{{cor_primaria}}]">{{email_contato}}</a>
      <span>Resposta em até 1 dia útil</span>
    </div>
  </div>
</section>
