<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: agzos-file:; media-src agzos-file:; frame-src 'self' blob: agzos-file:; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:;" />
  <title>Agzos Code</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="styles/ai-panel.css" />
  <link rel="stylesheet" href="styles/terminal.css" />
  <link rel="stylesheet" href="styles/git.css" />
  <link rel="stylesheet" href="styles/modules.css" />
  <link rel="stylesheet" href="styles/broom.css" />
  <link rel="stylesheet" href="styles/envvault.css" />
  <link rel="stylesheet" href="styles/viewers.css" />
</head>

<body class="theme-agzos-dark">
  <!-- TOP BAR -->
  <header id="topbar">
    <div class="topbar-left">
      <img src="assets/logo-icon.svg" alt="Agzos Code" class="topbar-logo" />
      <!-- Barra de menus in-app (Windows/Linux): preenchida por menubar.js -->
      <nav id="menubar" class="menubar" role="menubar" aria-label="Menu principal" hidden></nav>
      <span class="topbar-title">Agzos Code</span>
      <span class="topbar-section" id="topbar-workspace">— Sem pasta aberta</span>
    </div>
    <div class="topbar-center">
      <input type="text" id="search" placeholder="Buscar arquivos (Ctrl+P)…" spellcheck="false" autocomplete="off" />
    </div>
    <div class="topbar-right">
      <button class="topbar-btn icon-host" id="btn-toggle-sidebar" title="Alternar Sidebar (Ctrl+B)"></button>
      <button class="topbar-btn icon-host" id="btn-toggle-terminal" title="Alternar Terminal (Ctrl+`)"></button>
      <button class="topbar-btn icon-host" id="btn-command-palette" title="Command Palette (Ctrl+Shift+P)"></button>
      <button class="topbar-btn icon-host" id="btn-settings" title="Configurações (Ctrl+,)"></button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div id="main">
    <!-- Activity Bar (lateral estreita) -->
    <nav id="activitybar">
      <button class="activity-btn active icon-host" data-view="explorer" title="Explorer (Ctrl+Shift+E)"></button>
      <button class="activity-btn icon-host" data-view="search" title="Buscar (Ctrl+Shift+F)"></button>
      <button class="activity-btn icon-host" data-view="git" title="Controle de Versão (Ctrl+Shift+G)"></button>
      <button class="activity-btn icon-host" data-view="modules" title="Módulos Agzos (Ctrl+Shift+X)"></button>
      <button class="activity-btn icon-host" data-view="ai" title="Agzos IA"></button>
      <div class="activity-spacer"></div>
      <button class="activity-btn icon-host" id="btn-activity-settings" title="Configurações (Ctrl+,)"></button>
    </nav>

    <!-- Sidebar (esquerda) -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span id="sidebar-title">EXPLORER</span>
        <div class="sidebar-actions" id="explorer-actions">
          <button class="icon-btn icon-host" id="btn-new-file" title="Novo Arquivo…"></button>
          <button class="icon-btn icon-host" id="btn-new-folder" title="Nova Pasta…"></button>
          <button class="icon-btn icon-host" id="btn-refresh-explorer" title="Atualizar Explorer"></button>
          <button class="icon-btn icon-host" id="btn-collapse-folders" title="Recolher Pastas no Explorer"></button>
        </div>
      </div>
      <div class="sidebar-content" id="sidebar-content">
        <div class="empty-state" id="empty-explorer">
          <p>Nenhuma pasta aberta.</p>
          <button class="primary-btn" id="btn-open-folder-2">Abrir Pasta</button>
        </div>
        <div class="file-tree" id="file-tree" hidden></div>
        <div class="panel" id="panel-search" hidden>
          <input type="text" id="search-text" placeholder="Buscar texto nos arquivos…" />
          <div id="search-results"></div>
        </div>
        <!-- Controle de versão: preenchido por git-panel.js -->
        <div class="panel" id="panel-git" hidden aria-label="Controle de versão"></div>
        <!-- Hub "Módulos Agzos": preenchido por modules-hub.js -->
        <div class="panel" id="panel-modules" hidden aria-label="Módulos Agzos"></div>
        <!-- Host "left" do Agzos IA. O #ai-panel é movido entre hosts por ai-dock.js
             (sidebar, #right-dock, #pane-ai) e preenchido por ai-chat.js. -->
        <div class="panel" id="panel-ai" hidden>
          <section id="ai-panel" class="ai-panel" aria-label="Agzos IA"></section>
        </div>
      </div>
    </aside>

    <!-- Workbench body (Editor + Resizer + Terminal/Bottom Panel) -->
    <div id="workbench-body" class="panel-bottom">
      <main id="editor-area">
        <div id="tabs-bar">
          <div id="tabs"></div>
          <!-- Ações do editor ativo (ex.: pré-visualização de Markdown) -->
          <div id="editor-actions" hidden></div>
        </div>
        <div id="editor-row">
          <div id="editor-host">
            <!-- Welcome screen do editor (preenchido por welcome.js).
                 #viewer-host (abas de visualização) é criado aqui por viewers/index.js -->
            <div class="welcome" id="welcome"></div>
          </div>
          <!-- Pré-visualização de Markdown ao lado (viewers/markdown-side.js) -->
          <aside id="md-preview-side" aria-label="Pré-visualização de Markdown" hidden></aside>
        </div>
      </main>

      <div id="panel-resizer" class="panel-resizer" hidden></div>

      <!-- BOTTOM / SIDE PANEL: Terminal -->
      <section id="bottom-panel" data-active-tab="terminal" hidden>
        <div class="bottom-tabs">
          <div class="bottom-tab-strip" role="tablist">
          <button class="bottom-tab active" data-tab="terminal" role="tab" aria-selected="true">TERMINAL</button>
          <button class="bottom-tab" data-tab="ports" role="tab" aria-selected="false">PORTAS<span class="bottom-tab-count" hidden></span></button>
          <button class="bottom-tab" data-tab="output" role="tab" aria-selected="false">OUTPUT</button>
          <button class="bottom-tab" data-tab="problems" role="tab" aria-selected="false">PROBLEMAS</button>
          <button class="bottom-tab" data-tab="ai" role="tab" aria-selected="false" hidden>AGZOS IA</button>
          </div>
          <div class="bottom-spacer"></div>
          <!-- Ações da aba TERMINAL (somem nas outras abas) -->
          <div class="panel-actions" data-for="terminal">
            <span class="term-active" id="term-active"><span class="term-active-icon" id="term-active-icon"></span><span class="term-active-name" id="term-active-name">Terminal</span></span>
            <div class="term-new-group">
              <button class="icon-btn" id="btn-term-new" title="Novo Terminal (Ctrl+Shift+`)" aria-label="Novo terminal"></button>
              <button class="icon-btn term-new-caret" id="btn-term-profiles" title="Novo Terminal com Perfil…" aria-label="Escolher perfil do novo terminal" aria-haspopup="menu" aria-expanded="false"></button>
            </div>
            <button class="icon-btn" id="btn-term-split" title="Dividir Terminal (Ctrl+Shift+5)" aria-label="Dividir terminal"></button>
            <button class="icon-btn" id="btn-term-kill" title="Matar Terminal" aria-label="Matar terminal"></button>
            <button class="icon-btn" id="btn-term-more" title="Mais Ações…" aria-label="Mais ações do terminal" aria-haspopup="menu" aria-expanded="false"></button>
            <span class="panel-actions-sep" aria-hidden="true"></span>
          </div>
          <!-- Ações da aba PORTAS -->
          <div class="panel-actions" data-for="ports">
            <button class="icon-btn" id="btn-ports-refresh" title="Atualizar Portas" aria-label="Atualizar portas"></button>
            <span class="panel-actions-sep" aria-hidden="true"></span>
          </div>
          <button class="icon-btn icon-host" id="btn-pos-terminal" title="Mover Painel para a Direita"></button>
          <button class="icon-btn icon-host" id="btn-maximize-bottom" title="Maximizar Painel"></button>
          <button class="icon-btn icon-host" id="btn-close-bottom" title="Fechar (Esc)"></button>
        </div>
        <div class="bottom-content">
          <div class="bottom-pane active" id="pane-terminal">
            <!-- Grupos de sessões (.term-group > .term-instance), montados por terminal.js -->
            <div id="terminal-host"></div>
            <div id="term-sessions" class="term-sessions" role="listbox" aria-label="Sessões de terminal" hidden></div>
          </div>
          <div class="bottom-pane" id="pane-ports">
            <div class="ports-view" id="ports-view"></div>
          </div>
          <div class="bottom-pane" id="pane-output">
            <pre id="output-pre" class="output-pre">Sem saída ainda.</pre>
          </div>
          <div class="bottom-pane" id="pane-problems">
            <div class="empty-state">Sem problemas.</div>
          </div>
          <!-- Host "bottom" do Agzos IA -->
          <div class="bottom-pane" id="pane-ai"></div>
        </div>
      </section>
    </div>

    <!-- Host "right" do Agzos IA (coluna à direita do workbench) -->
    <aside id="right-dock" hidden>
      <div id="right-dock-resizer" class="right-dock-resizer" role="separator" aria-orientation="vertical"
        aria-label="Redimensionar painel Agzos IA"></div>
      <div id="right-dock-host" class="right-dock-host"></div>
    </aside>
  </div>

  <!-- STATUS BAR -->
  <footer id="statusbar">
    <div class="status-left">
      <button type="button" class="status-item icon-host" id="status-remote-host" title="Abrir uma conexão remota" aria-label="Abrir uma conexão remota"><span class="status-remote-label"></span></button>
      <span class="status-item icon-host" id="status-remote"></span>
      <span class="status-item" id="status-sync" hidden></span>
    </div>
    <div class="status-right">
      <span class="status-item icon-host" id="status-perf"></span>
      <span class="status-item icon-host" id="status-ai"></span>
      <span class="status-item" id="status-broom" hidden role="button" tabindex="0" title="Vassoura de Produção: itens para limpar neste arquivo (clique para ver)"></span>
      <span class="status-item" id="status-lang">Texto Simples</span>
      <span class="status-item" id="status-pos">Ln 1, Col 1</span>
      <span class="status-item" id="status-encoding">UTF-8</span>
      <span class="status-item" id="status-eol">LF</span>
    </div>
  </footer>

  <!-- COMMAND PALETTE OVERLAY (bug fix: tinha CSS display:flex que sobrescrevia [hidden]) -->
  <div id="cmd-overlay" class="overlay" hidden>
    <div class="cmd-palette">
      <div class="cmd-palette-input">
        <span class="cmd-palette-input-icon icon-host"></span>
        <input type="text" id="cmd-input" placeholder="Digite um comando…" autocomplete="off" spellcheck="false" />
      </div>
      <ul id="cmd-list"></ul>
    </div>
  </div>

  <!-- WELCOME POP-UP (logo Agzos completo) -->
  <div id="welcome-popup" class="overlay"></div>

  <!-- ONBOARDING WIZARD (multi-step) -->
  <div id="onboarding-overlay" class="overlay"></div>

  <div id="ai-wizard-overlay" class="overlay" hidden></div>

  <!-- SETTINGS MODAL (padrão VS Code separado) -->
  <div id="settings-modal-overlay" class="overlay settings-overlay" hidden></div>

  <!-- CONTEXT MENU (file tree) -->
  <div id="context-menu" class="context-menu" hidden>
    <ul>
      <li data-action="rename">Renomear</li>
      <li data-action="delete">Excluir</li>
      <li data-action="new-file">Novo Arquivo</li>
      <li data-action="new-folder">Nova Pasta</li>
      <li data-action="reveal">Revelar no Explorer do SO</li>
    </ul>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <!-- Sprite do Lucide (deve vir ANTES do app.js pra estar no body quando o boot rodar) -->
  <script src="vendor/lucide/inline.js"></script>
  <!-- State global (window.AgzosState) — script clássico, roda antes dos módulos ESM.
       Sem ele todo módulo lê State = undefined e o boot quebra (tela preta). -->
  <script src="scripts/state.js"></script>
  <script src="vendor/marked/marked.umd.js"></script>
  <script src="vendor/dompurify/purify.min.js"></script>
  <!-- App principal (ESM) -->
  <script type="module" src="scripts/app.js"></script>
</body>

</html>
