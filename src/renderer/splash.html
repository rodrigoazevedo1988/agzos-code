<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Agzos Code</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0E0E0E;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .splash {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 18px;
    }
    .logo-img {
      height: 64px;
      width: auto;
    }
    .name { font-size: 20px; font-weight: 600; letter-spacing: 0.3px; }
    .tag { font-size: 12px; color: #9a9a9a; }
    .bar {
      width: 180px; height: 3px; background: #1a1a1a;
      border-radius: 2px; overflow: hidden; margin-top: 8px;
    }
    .bar > div {
      width: 30%; height: 100%; background: #D10A11;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      50%  { transform: translateX(220%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <img src="assets/logo-full-dark.svg" alt="Agzos Code" class="logo-img" />
    <div class="bar"><div></div></div>
    <div class="tag">Iniciando o editor…</div>
  </div>
</body>
</html>
