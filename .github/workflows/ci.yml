name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint e testes unitários
        run: npm run check

      - name: Instalar Xvfb (display virtual para o Electron)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Testes E2E
        run: xvfb-run -a npm run test:e2e

      - name: Relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7
