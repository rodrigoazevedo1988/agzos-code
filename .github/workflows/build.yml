name: Build

# Builds dos três "ports" (Windows, Linux, macOS) sem publicar release.
# Roda manualmente e em tags; a publicação/auto-update é a Fase 5.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 está sendo desativado (brownout do runner image em 2026-11).
          # macos-15 continua x64 e cross-compila arm64 no mesmo runner.
          - name: macOS (arm64 + x64)
            os: macos-15
            script: dist:mac
          - name: Windows (x64 + arm64)
            os: windows-latest
            script: dist:win
          - name: Linux (x64)
            os: ubuntu-22.04
            script: dist:linux
    env:
      # Sem certificado no CI: não tenta assinar/notarizar.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências Linux para DEB/RPM
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}

      # Garante que sujeira do macOS (._*, .DS_Store, .AppleDouble) não vai
      # para o instalador. O hook afterPack e o build.files já removem; este
      # passo falha o build se algo escapar.
      - name: Verificar ausência de arquivos ._* (AppleDouble)
        shell: bash
        run: |
          if find dist \( -name '._*' -o -name '.AppleDouble' \) -print -quit | grep -q .; then
            echo "::error::Arquivos AppleDouble (._*) encontrados no pacote:"
            find dist \( -name '._*' -o -name '.AppleDouble' \) -print | head -50
            exit 1
          fi
          echo "OK: nenhum arquivo ._* no pacote."

      # O terminal usa node-pty (módulo nativo). Se ele não for empacotado fora
      # do asar, ou se os binários da plataforma sumirem, o app cai para o modo
      # degradado sem avisar durante o build. Aqui isso falha o build.
      - name: Verificar node-pty empacotado (pty real do terminal)
        shell: bash
        run: |
          set -e
          UNPACKED=$(find dist -type d -name 'app.asar.unpacked' -print -quit)
          if [ -z "$UNPACKED" ]; then
            echo "::error::app.asar.unpacked não encontrado — node-pty ficaria dentro do asar."
            exit 1
          fi
          PTY_DIR="$UNPACKED/node_modules/node-pty/prebuilds"
          if [ ! -d "$PTY_DIR" ]; then
            echo "::error::node-pty não foi empacotado fora do asar em $UNPACKED"
            exit 1
          fi

          # Binários exigidos por plataforma. No Windows o ConPTY precisa de
          # .dll/.exe; no macOS o spawn-helper roda via posix_spawn; no Linux
          # não há prebuild — o módulo é compilado localmente em build/Release.
          case "${{ runner.os }}" in
            Windows)
              REQUIRED="win32-x64/pty.node win32-x64/conpty.node win32-x64/winpty.dll win32-x64/winpty-agent.exe win32-x64/conpty/conpty.dll"
              ;;
            macOS)
              ARCH=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo x64)
              REQUIRED="darwin-$ARCH/pty.node darwin-$ARCH/spawn-helper"
              ;;
            *)
              REQUIRED=""
              if [ ! -f "$UNPACKED/node_modules/node-pty/build/Release/pty.node" ]; then
                echo "::error::node-pty sem prebuild e sem binário compilado (build/Release/pty.node) no Linux."
                echo "::error::O terminal cairia para o modo degradado."
                exit 1
              fi
              ;;
          esac

          for f in $REQUIRED; do
            if [ ! -f "$PTY_DIR/$f" ]; then
              echo "::error::Binário do node-pty ausente no pacote: $f"
              find "$PTY_DIR" -type f | head -40
              exit 1
            fi
          done

          # spawn-helper precisa do bit de execução (é argv[0] do posix_spawn).
          # Só vale para macOS/Linux: o pacote Windows carrega junto os prebuilds
          # do darwin (inofensivos, não são usados) e o NTFS não tem bit de
          # execução, então checar lá daria falso negativo.
          if [ "${{ runner.os }}" != "Windows" ]; then
            while read -r helper; do
              if [ -n "$helper" ] && [ ! -x "$helper" ]; then
                echo "::error::spawn-helper sem permissão de execução: $helper"
                exit 1
              fi
            done <<< "$(find "$PTY_DIR" -name 'spawn-helper' -type f)"
          fi

          echo "OK: node-pty empacotado fora do asar com os binários da plataforma."
          find "$PTY_DIR" -type f | sed 's|^|  |' | head -20

      - name: Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: agzos-code-${{ runner.os }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
          if-no-files-found: error
          retention-days: 14
