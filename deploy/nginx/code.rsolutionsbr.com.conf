server {
    listen 80;
    listen [::]:80;
    server_name code.rsolutionsbr.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name code.rsolutionsbr.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/code.rsolutionsbr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.rsolutionsbr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        return 302 /release/;
    }

    location = /release {
        return 301 /release/;
    }

    location ^~ /release/ {
        alias /var/www/agzos-code-releases/current/;
        autoindex off;
        try_files $uri =404;

        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~* /latest(?:-mac|-linux)?\.ya?ml$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location ~* \.(?:exe|zip|dmg|AppImage|deb|rpm|blockmap)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
    }
}
